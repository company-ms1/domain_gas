<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180" width="600" height="180" style="background:#0b1020">
  <style>
    text{font-family:Arial, sans-serif;font-size:14px;fill:#eaf2ff}
    .box{fill:#0f152a;stroke:#6ee7ff;stroke-width:2}
    .icon{font-size:20px}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#6ee7ff" />
    </marker>
  </defs>
  <rect x="20" y="60" width="120" height="60" class="box"/>
  <text x="40" y="95">Stake TRX</text>
  <line x1="140" y1="90" x2="230" y2="90" stroke="#6ee7ff" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="230" y="20" width="170" height="60" class="box"/>
  <text x="240" y="55">Get Energy</text>
  <text x="390" y="50" class="icon">🔋</text>
  <rect x="230" y="100" width="170" height="60" class="box"/>
  <text x="240" y="135">Get Bandwidth</text>
  <text x="390" y="130" class="icon">⚡</text>
  <text x="230" y="15" font-size="12" fill="#eaf2ff">All contract calls consume Energy</text>
  <text x="230" y="175" font-size="12" fill="#eaf2ff">All transactions consume Bandwidth</text>
</svg>